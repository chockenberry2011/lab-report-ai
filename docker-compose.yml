version: '3.8'

services:
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    platform: linux/arm64
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
      - DATA_DIR=/data
      - ENVIRONMENT=development
      - MODEL_ROLES_DIR=/models/roles
      - MODEL_TESTROW_DIR=/models/testrow
    volumes:
      - ./data:/data
      - ./models:/models
      - ./services:/services  # Mount all services for imports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
      - DATA_DIR=/data
      - WORKER_CONCURRENCY=1
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - MODEL_ROLES_DIR=/models/roles
      - MODEL_TESTROW_DIR=/models/testrow
      - LAB_DEBUG=1               # write debug snapshots
      - LAB_FORCE_FALLBACK=0
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - ROLES_FORCE_MODEL=1              # always use ML roles (no heuristic fallback)
      - ROLES_FALLBACK_MIN_TEST_ROWS=0   # (redundant with FORCE=1, but set for clarity)
    volumes:
      - ./data:/data
      - ./models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["./start_worker.sh"]
    healthcheck:
      test: ["CMD", "celery", "-A", "tasks", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Flower for monitoring (optional)
  flower:
    platform: linux/arm64
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/app:/services
    volumes:
      - ./services:/services
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "tasks", "flower", "--port=5555"]
    restart: unless-stopped
    profiles:
      - monitoring

  extractor:
    platform: linux/arm64
    build:
      context: ./services/extractor
      dockerfile: Dockerfile
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - .:/app
      - ./data:/data
      - ./models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["sleep", "infinity"]

  trainer:
    platform: linux/arm64
    build:
      context: .
      dockerfile: services/trainer/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./data:/data
      - ./models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["sh", "-lc", "sleep infinity"]

  ui:
    platform: linux/arm64
    container_name: lab-ui
    build:
      context: .
      dockerfile: ui/Dockerfile
      target: ui
      args:
        UI_BUILD_CACHE_BUSTER: ${UI_BUILD_CACHE_BUSTER:-0}
    ports:
      - "3000:80"
    environment:
      - API_URL=http://api:8000
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health || wget -qO- http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10

  labelstudio:
    image: heartexlabs/label-studio:latest
    platform: linux/arm64
    ports:
      - "8080:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/data
      - LABEL_STUDIO_USER_TOKEN=${LABEL_STUDIO_USER_TOKEN:-your-token-here}
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME:-admin@localhost}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD:-changeme}
    volumes:
      - ./data:/data
      - ./data/labelstudio:/label-studio/data
    restart: unless-stopped

  airflow-postgres:
    image: postgres:15-alpine
    platform: linux/arm64
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - airflow

  airflow-init:
    platform: linux/arm64
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    # image: apache/airflow:2.8.1
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-changeme}@airflow-postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-your-32-character-fernet-key-here}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY:-your-secret-key-here}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-changeme}
    volumes:
      - ./orchestrator:/opt/airflow/orchestrator
      - ./scripts:/scripts
    depends_on:
      - airflow-postgres
    command: |
      bash -c "
        airflow db init &&
        airflow users create --role Admin --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} --email ${_AIRFLOW_WWW_USER_EMAIL:-user@example.com} --firstname Admin --lastname User --password ${_AIRFLOW_WWW_USER_PASSWORD:-changeme} --skip-if-exists
      "
    profiles:
      - airflow

  airflow-webserver:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    # image: apache/airflow:2.8.1
    platform: linux/arm64
    ports:
      - "8081:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-changeme}@airflow-postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-your-32-character-fernet-key-here}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY:-your-secret-key-here}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - API_URL=http://api:8000
      - DATA_DIR=/data
      - MODELS_DIR=/models
    volumes:
      - ./orchestrator/dags:/opt/airflow/dags
      - ./orchestrator/plugins:/opt/airflow/plugins
      - ./orchestrator/config:/opt/airflow/config
      - ./data:/data
      - ./models:/models
      - ./scripts:/scripts
      - ./services:/services
    depends_on:
      - airflow-postgres
      - airflow-init
      - redis
    command: airflow webserver
    restart: unless-stopped
    profiles:
      - airflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-scheduler:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    # image: apache/airflow:2.8.1
    platform: linux/arm64
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-changeme}@airflow-postgres:5432/${POSTGRES_DB:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-your-32-character-fernet-key-here}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY:-your-secret-key-here}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - API_URL=http://api:8000
      - DATA_DIR=/data
      - MODELS_DIR=/models
    volumes:
      - ./orchestrator/dags:/opt/airflow/dags
      - ./orchestrator/plugins:/opt/airflow/plugins
      - ./orchestrator/config:/opt/airflow/config
      - ./data:/data
      - ./models:/models
      - ./scripts:/scripts
      - ./services:/services
    depends_on:
      - airflow-postgres
      - airflow-init
      - redis
    command: airflow scheduler
    restart: unless-stopped
    profiles:
      - airflow
    healthcheck:
      test: ["CMD", "python", "-c", "import subprocess; subprocess.check_call(['airflow', 'jobs', 'check', '--job-type', 'SchedulerJob', '--local'])"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  redis_data:
  postgres_data:
